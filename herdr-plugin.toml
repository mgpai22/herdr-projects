id = "herdr-projects"
name = "Projects"
version = "0.2.13-omp.1"
min_herdr_version = "0.9.1"
description = "A coordinator conversation, parallel worker threads, shared memory and an overview of what needs you."
platforms = ["macos", "linux", "windows"]

# Commands name target/release/herdr-projects without `.exe`: herdr joins the
# plugin root, and on Windows both of its launchers add `.exe` to an
# extensionless path (Rust's `Command` for actions and startup, portable-pty's
# PATHEXT search for panes).

[[build]]
# Downloads the release binary; falls back to `cargo build --release --locked`.
platforms = ["macos", "linux"]
command = ["sh", "scripts/install.sh"]

[[build]]
# No Windows release binaries: `cargo build --release --locked` into target\.
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/install.ps1"]

[[startup]]
command = ["target/release/herdr-projects", "startup"]

[[actions]]
id = "new"
title = "Projects: new project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "new"]

[[actions]]
id = "open"
title = "Projects: open project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "open"]

[[actions]]
id = "open-popup"
title = "Projects"
contexts = ["global", "workspace"]
command = ["target/release/herdr-projects", "action", "open-popup"]

[[actions]]
id = "focus"
title = "Projects: focus sidebar on this project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "focus"]

[[actions]]
id = "unfocus"
title = "Projects: clear sidebar focus"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "unfocus"]

[[actions]]
id = "adopt-workspace"
title = "Projects: continue this workspace as a project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "adopt-workspace"]

[[actions]]
id = "pause"
title = "Projects: pause project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "pause"]

[[actions]]
id = "resume"
title = "Projects: resume project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "resume"]

[[actions]]
id = "configure"
title = "Projects: set up the sidebar, popup key, progress hooks, OMP extension and skill"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "configure"]

[[actions]]
id = "doctor"
title = "Projects: check setup"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "doctor"]

[[panes]]
id = "projects"
title = "Projects"
placement = "popup"
width = "80%"
height = "80%"
command = ["target/release/herdr-projects", "pane", "projects"]

[[panes]]
id = "new"
title = "New project"
placement = "popup"
command = ["target/release/herdr-projects", "pane", "new"]

[[panes]]
id = "pick"
title = "Pick a project"
placement = "popup"
command = ["target/release/herdr-projects", "pane", "pick"]

[[panes]]
id = "adopt"
title = "Continue as a project"
placement = "popup"
command = ["target/release/herdr-projects", "pane", "adopt"]
